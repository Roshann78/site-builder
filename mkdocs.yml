site_name: !ENV [SITE_NAME, 'My Notes']
site_url: !ENV [SITE_URL, 'https://example.com']

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - content.code.copy
    - navigation.path
    - navigation.footer
    - toc.follow

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/sb-extra.css
